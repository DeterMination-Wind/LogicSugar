apply plugin: "java"

version = "1.1.1"
sourceSets{
    main.java.srcDirs = ["src"]
    test.java.srcDirs = ["test"]
}

repositories{
    mavenCentral()
}

java{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext{
    mindustryVersion = "v155.4"
}

dependencies{
    compileOnly files("../Mindustry-master/desktop/build/libs/Mindustry.jar")
    testImplementation files("../Mindustry-master/desktop/build/libs/Mindustry.jar")
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = "UTF-8"
    options.release = 17
}

jar{
    archiveFileName = "LogicSugar-v${version}.jar"
    from(projectDir){ include "mod.json" }
    from(projectDir){ include "icon.png" }
    from("assets/"){ include "**" }
}

tasks.register("releaseZip", Zip){
    dependsOn jar
    archiveFileName = "LogicSugar-v${version}.zip"
    from(jar)
    from("README.md")
    from("LICENSE")
    from("assets/sample.png"){ into("assets") }
}

tasks.register("selfTest", JavaExec){
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "logicsugar.SugarCompilerSelfTest"
}

test.enabled = false
check.dependsOn selfTest
