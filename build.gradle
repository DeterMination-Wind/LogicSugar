apply plugin: "java"

version = "5.4.0"
sourceSets{
    main.java.srcDirs = ["src"]
    test.java.srcDirs = ["test"]
}

repositories{
    mavenCentral()
}

java{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext{
    mindustryVersion = "v160.1"
    isWindows = System.getProperty("os.name").toLowerCase(Locale.ROOT).contains("windows")
}

dependencies{
    def mindustryJar = project.findProperty("mindustryJar") ?: "../Mindustry-master/desktop/build/libs/Mindustry.jar"
    compileOnly files(mindustryJar)
    testImplementation files(mindustryJar)
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = "UTF-8"
    options.release = 17
}

jar{
    archiveFileName = "LogicSugar-v${version}-desktop.jar"
    from(projectDir){ include "mod.json" }
    from(projectDir){ include "icon.png" }
    from("assets/"){ include "**" }
}

tasks.register("releaseZip", Zip){
    dependsOn deploy
    archiveFileName = "LogicSugar-v${version}.zip"
    from(deploy)
    from("README.md")
    from("LICENSE")
    from("assets/sample.png"){ into("assets") }
}

