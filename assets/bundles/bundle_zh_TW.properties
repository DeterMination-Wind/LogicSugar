# ===== 資料子系統：卡片提示 =====
logicsugar.hint.matrix.name = 表達式中用雙下標存取的矩陣名，如 m[i][j]。位址 = 基址 + i*欄數 + j；必須全程式唯一。
logicsugar.hint.matrix.rows = 行數；至少為 1 的整數。字面量行下標超出 [0, 行數) 時於編譯期報錯。
logicsugar.hint.matrix.cols = 欄數；至少為 1 的整數。字面量欄下標超出 [0, 欄數) 時於編譯期報錯。
logicsugar.hint.arrayinit.name = 要初始化的陣列名，必須已由上方的 array 卡宣告。槽 0..7 對應寫入 buf[0..7] 的值；~ 表示略過該槽。
logicsugar.hint.stack.name = 堆疊名：運算卡與表達式都用它引用這個堆疊（推入、彈出、查看頂端、大小、清空）。必須全程式唯一。
logicsugar.hint.stack.memory = 承載堆疊資料的記憶體方塊變數，如 cell1。宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.stack.base = 堆疊在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.stack.size = 最大元素個數；至少為 1 的整數。對滿堆疊推入時回傳目前長度且不寫入。
logicsugar.hint.queue.name = 佇列名：運算卡與表達式都用它引用這個佇列（入列、出列、查看前端、大小、清空）。必須全程式唯一。
logicsugar.hint.queue.memory = 承載佇列資料的記憶體方塊變數，如 cell1。宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.queue.base = 環形緩衝區在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.queue.size = 環形緩衝區容量；至少為 1 的整數。對滿佇列推入時回傳目前長度且不寫入。
logicsugar.hint.deque.name = 雙端佇列名：運算卡與表達式都用它引用這個雙端佇列（前端推入、後端推入、前端彈出、後端彈出、查看前端、查看後端、大小、清空）。必須全程式唯一。
logicsugar.hint.deque.memory = 存放雙端佇列資料的記憶體方塊變數，如 cell1。同一記憶體方塊上與其它堆疊/佇列/雙端佇列宣告的區間不得重疊。
logicsugar.hint.deque.base = 環形緩衝區在記憶體方塊上的起始物理位址；非負整數字面量。
logicsugar.hint.deque.size = 環形緩衝區容量；至少為 1 的整數。對滿的雙端佇列推入時回傳目前長度且不寫入。
logicsugar.hint.bitset.name = 位元集名：運算卡與表達式都用它引用這個位元集（設定位元、清除位元、測試位元、統計位元數）。必須全程式唯一。
logicsugar.hint.bitset.memory = 承載位元字組的記憶體方塊變數，如 cell1。宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.bitset.base = 第一個字組在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.bitset.words = 64 位元字組的個數；至少為 1 的整數。位元下標 i 位於第 i/64 個字組的第 i%64 位元。
logicsugar.hint.map.name = 雜湊表名：運算卡與表達式都用它引用這張表（寫入、讀取、存在性、刪除、大小、清空）。首次使用前先呼叫一次「清空」，把所有 key 槽寫為 NaN；必須全程式唯一。
logicsugar.hint.map.memory = 承載鍵與值的記憶體方塊變數，如 cell1。鍵佔用 [基址, 基址+容量)，值佔用 [基址+容量, 基址+2*容量)。
logicsugar.hint.map.base = 鍵區起始實體位址；非負整數字面量。
logicsugar.hint.map.capacity = 鍵/值槽位數；至少為 1 的整數。需要 2*容量 個記憶體單元；不支援字串鍵。
logicsugar.hint.uset.name = 集合名：運算卡與表達式都用它引用這個集合（加入、存在性、刪除、大小、清空）。首次使用前先呼叫一次「清空」，把所有槽寫為 NaN；必須全程式唯一。
logicsugar.hint.uset.memory = 存放鍵的記憶體方塊變數，如 cell1。占用 [base, base+capacity)。
logicsugar.hint.uset.base = 鍵區起始物理位址；非負整數字面量。
logicsugar.hint.uset.capacity = 鍵槽位數；至少為 1 的整數。首次使用前先呼叫一次「清空」。不支援字串鍵。
logicsugar.hint.list.name = 清單名：運算卡與表達式都用它引用這個清單（追加、讀取、寫入、插入、刪除、尋找、大小）。必須全程式唯一。
logicsugar.hint.list.memory = 承載清單資料的記憶體方塊變數，如 cell1。宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.list.base = 清單在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.list.size = 最大元素個數；至少為 1 的整數。對滿清單附加時回傳目前長度且不寫入。
logicsugar.hint.heap.name = 最小堆名：運算卡與表達式都用它引用這個堆（推入、彈出、大小）。必須全程式唯一。
logicsugar.hint.heap.memory = 承載堆資料的記憶體方塊變數，如 cell1。宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.heap.base = 堆在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.heap.size = 最大元素個數；至少為 1 的整數。對滿堆推入時回傳目前長度且不寫入。
logicsugar.hint.chain.name = 鏈結串列名：運算卡與表達式都用它引用這個鏈結串列（初始化、重設、配置節點、釋放節點、讀取節點值、寫入節點值、下一個節點、連結節點、設定頭、讀取頭、長度）。必須全程式唯一。
logicsugar.hint.chain.memory = 承載鏈結串列節點的記憶體方塊變數，如 cell1。節點 i 的值槽在 基址+2*i、next 槽在 基址+2*i+1；宣告的區間不可與同一記憶體方塊上的其他結構重疊。
logicsugar.hint.chain.base = 第一個節點值槽的起始實體位址；非負整數字面量。
logicsugar.hint.chain.size = 節點個數；至少為 1 的整數。需要 2*size 個記憶體單元；空閒鏈為空時「配置節點」回傳 -1。

# ===== 資料子系統：調色盤說明 =====
logicsugar.lst.matrix = 矩陣：把記憶體方塊的一段 行數×欄數 區間登記為命名矩陣，讓表達式能用 m[i][j] 讀寫；位址 = 基址 + i*欄數 + j。
logicsugar.lst.arrayinit = 陣列初始化：在此處把最多 8 個字面量寫入陣列的連續槽位。
logicsugar.lst.record = 記錄：宣告一組固定欄位；p.欄位 讀取、p.欄位 = 值 寫入，每個欄位降級為一個普通變數。
logicsugar.lst.stack = 堆疊：把一段區間登記為後進先出堆疊；運算在同欄的「堆疊操作」卡上，提供推入、彈出、查看頂端、大小、清空（展開為 read/write 加隱藏的堆疊頂端變數）。
logicsugar.lst.queue = 佇列：把一段區間登記為環形緩衝區；運算在同欄的「佇列操作」卡上，提供入列、出列、查看前端、大小、清空（展開為 read/write 加隱藏的 head/tail/count 變數）。
logicsugar.lst.deque = 雙端佇列：把一段區間登記為雙端環形緩衝區；運算在同欄的「雙端佇列操作」卡上，提供前端推入、後端推入、前端彈出、後端彈出、查看前端、查看後端、大小、清空。
logicsugar.lst.bitset = 位元集：把記憶體方塊中的 64 位元字組登記為位元集；運算在同欄的「位集操作」卡上，提供設定位元、清除位元、測試位元、統計位元數（展開為 and/or/shl/shr 運算）。
logicsugar.lst.map = 雜湊表：把一段區間登記為開放定址雜湊表（先鍵區後值區）；運算在同欄的「雜湊表操作」卡上，提供寫入、讀取、存在性、刪除、大小、清空。首次使用前先呼叫一次「清空」。
logicsugar.lst.uset = 集合：把一段區間登記為開放定址鍵集合；運算在同欄的「集合操作」卡上，提供加入、存在性、刪除、大小、清空。首次使用前先呼叫一次「清空」。
logicsugar.lst.list = 清單：把一段區間登記為帶隱藏計數的有序清單；運算在同欄的「清單操作」卡上，提供追加、讀取、寫入、插入、刪除、尋找、大小。
logicsugar.lst.heap = 堆：把一段區間登記為帶隱藏計數的最小堆；運算在同欄的「堆操作」卡上，提供推入、彈出、大小。
logicsugar.lst.chain = 鏈結串列：把一段區間登記為單向鏈結串列節點（每節點兩槽：值、next）；運算在同欄的「鏈結串列操作」卡上，提供初始化、重設、配置節點、釋放節點、讀取節點值、寫入節點值、下一個節點、連結節點、設定頭、讀取頭、長度。首次使用前先呼叫一次「初始化」。

