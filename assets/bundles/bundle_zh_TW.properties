logicsugar.stack.card = 堆疊
logicsugar.queue.card = 佇列
logicsugar.deque.card = 雙端佇列
logicsugar.bitset.card = 位元集
logicsugar.bitset.words = 字數
logicsugar.map.card = 雜湊表
logicsugar.map.memory = 記憶體
logicsugar.map.base = 基址
logicsugar.map.capacity = 容量
