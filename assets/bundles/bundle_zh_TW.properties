setting.logicsugar.switchStrategy.name = Switch 分派策略
setting.logicsugar.switchStrategy.description = switch 的降級方式：auto 會按指令成本在每個 switch 上自動選擇比較鏈或 @counter 跳轉表（重複 case 值較多的 switch 會編譯成跳轉表）；chainOnly 一律使用比較鏈，與舊版輸出逐字一致。跳轉表假定 case 值為整數，出現其他值時自動回退到比較鏈。
logicsugar.settings.switchstrategy.auto = auto（更省則跳轉表）
logicsugar.settings.switchstrategy.chainOnly = chainOnly
