# ===== 可持久化資料 intrinsic 積木 =====
logicsugar.datacall.operation = 操作
logicsugar.datacall.arguments = 以逗號分隔的引數
logicsugar.hint.datacall.operation = 卡內運算按鈕：點開可選擇本結構的運算；切換運算會把引數重設成該運算的預設形狀。
logicsugar.hint.datacall.arguments = 依函式順序填寫引數，多個引數以逗號分隔。
logicsugar.lst.datacall = 可持久化的資料結構操作積木；編譯時依對應 intrinsic 降級。
logicsugar.lst.datacall.group.arrayalgo = 陣列運算：求和、平均值、最小值、最大值等 14 個運算。卡內按鈕切換。
logicsugar.lst.datacall.group.stackops = 堆疊操作：推入、彈出、查看頂端、大小、清空。卡內按鈕切換。
logicsugar.lst.datacall.group.queueops = 佇列操作：入列、出列、查看前端、大小、清空。卡內按鈕切換。
logicsugar.lst.datacall.group.dequeops = 雙端佇列操作：前端推入、後端推入、前端彈出、後端彈出等 8 個運算。卡內按鈕切換。
logicsugar.lst.datacall.group.bitsetops = 位集操作：設定位元、清除位元、測試位元、統計位元數。卡內按鈕切換。
logicsugar.lst.datacall.group.mapops = 雜湊表操作：寫入、讀取、存在性、刪除、大小、清空。卡內按鈕切換。
logicsugar.lst.datacall.group.setops = 集合操作：加入、存在性、刪除、大小、清空。卡內按鈕切換。
logicsugar.lst.datacall.group.listops = 清單操作：追加、讀取、寫入、插入等 7 個運算。卡內按鈕切換。
logicsugar.lst.datacall.group.heapops = 堆操作：推入、彈出、大小。卡內按鈕切換。
logicsugar.lst.datacall.group.chainops = 鏈結串列操作：初始化、重設、配置節點、釋放節點等 11 個運算。卡內按鈕切換。

# ===== Renamed data-structure operations (STL-named) =====
logicsugar.datacall.stack_push = 推入
logicsugar.hint.datacall.stack_push = stack_push(s, value)：s 是已宣告的堆疊，value 是要推入的值；成功時把推入後的堆疊長度寫入 result；堆疊已滿時不寫入，result 為 -1。
logicsugar.datacall.stack_pop = 彈出
logicsugar.hint.datacall.stack_pop = stack_pop(s)：s 是已宣告的堆疊；移除堆疊頂端，並將其值寫入 result（空堆疊回傳 NaN）。
logicsugar.datacall.stack_top = 查看頂端
logicsugar.hint.datacall.stack_top = stack_top(s)：s 是已宣告的堆疊；讀取堆疊頂端但不移除，並將值寫入 result（空堆疊回傳 NaN）。
logicsugar.datacall.stack_size = 大小
logicsugar.hint.datacall.stack_size = stack_size(s)：s 是已宣告的堆疊；將目前元素數量寫入 result。
logicsugar.datacall.stack_clear = 清空
logicsugar.hint.datacall.stack_clear = stack_clear(s)：s 是已宣告的堆疊；清空內容與隱藏堆疊頂端計數。此積木沒有回傳值。
logicsugar.datacall.queue_push = 入列
logicsugar.hint.datacall.queue_push = queue_push(q, value)：q 是已宣告的佇列，value 會追加到佇列尾端；成功時把入隊後長度寫入 result；佇列已滿時不寫入，result 為 -1。
logicsugar.datacall.queue_pop = 出列
logicsugar.hint.datacall.queue_pop = queue_pop(q)：q 是已宣告的佇列；移除佇列前端，並將其值寫入 result（空佇列回傳 NaN）。
logicsugar.datacall.queue_front = 查看前端
logicsugar.hint.datacall.queue_front = queue_front(q)：q 是已宣告的佇列；讀取佇列前端但不移除，並將值寫入 result（空佇列回傳 NaN）。
logicsugar.datacall.queue_size = 大小
logicsugar.hint.datacall.queue_size = queue_size(q)：q 是已宣告的佇列；將目前元素數量寫入 result。
logicsugar.datacall.queue_clear = 清空
logicsugar.hint.datacall.queue_clear = queue_clear(q)：q 是已宣告的佇列；清空內容與 head/tail/count 狀態。此積木沒有回傳值。
logicsugar.datacall.deque_push_front = 前端推入
logicsugar.hint.datacall.deque_push_front = deque_push_front(d, value)：d 是已宣告的雙端佇列，value 插入前端；成功時把操作後長度寫入 result；已滿時不寫入，result 為 -1。
logicsugar.datacall.deque_push_back = 後端推入
logicsugar.hint.datacall.deque_push_back = deque_push_back(d, value)：d 是已宣告的雙端佇列，value 插入後端；成功時把操作後長度寫入 result；已滿時不寫入，result 為 -1。
logicsugar.datacall.deque_pop_front = 前端彈出
logicsugar.hint.datacall.deque_pop_front = deque_pop_front(d)：d 是已宣告的雙端佇列；移除前端並將值寫入 result（空時回傳 NaN）。
logicsugar.datacall.deque_pop_back = 後端彈出
logicsugar.hint.datacall.deque_pop_back = deque_pop_back(d)：d 是已宣告的雙端佇列；移除後端並將值寫入 result（空時回傳 NaN）。
logicsugar.datacall.deque_front = 查看前端
logicsugar.hint.datacall.deque_front = deque_front(d)：d 是已宣告的雙端佇列；讀取前端但不移除，並將值寫入 result（空時回傳 NaN）。
logicsugar.datacall.deque_back = 查看後端
logicsugar.hint.datacall.deque_back = deque_back(d)：d 是已宣告的雙端佇列；讀取後端但不移除，並將值寫入 result（空時回傳 NaN）。
logicsugar.datacall.deque_size = 大小
logicsugar.hint.datacall.deque_size = deque_size(d)：d 是已宣告的雙端佇列；將目前元素數量寫入 result。
logicsugar.datacall.deque_clear = 清空
logicsugar.hint.datacall.deque_clear = deque_clear(d)：d 是已宣告的雙端佇列；清空內容與 head/tail/count 狀態。此積木沒有回傳值。
logicsugar.datacall.vector_push_back = 追加
logicsugar.hint.datacall.vector_push_back = vector_push_back(list, value)：list 是已宣告的清單，value 追加到末尾；成功時把追加後清單長度寫入 result；清單已滿時不寫入，result 為 -1。
logicsugar.datacall.vector_at = 讀取
logicsugar.hint.datacall.vector_at = vector_at(list, index)：list 是已宣告的清單，index 是元素索引；將該元素寫入 result，越界時為 NaN。
logicsugar.datacall.vector_set = 寫入
logicsugar.hint.datacall.vector_set = vector_set(list, index, value)：list 是已宣告的清單，index 是元素索引，value 是要寫入的值；成功向 result 寫入 1；越界不寫入，result 為 -1。
logicsugar.datacall.vector_insert = 插入
logicsugar.hint.datacall.vector_insert = vector_insert(list, index, value)：list 是已宣告的清單，index 是插入位置，value 插入該位置；成功向 result 寫入 1；無效或已滿不寫入，result 為 -1。
logicsugar.datacall.vector_erase = 刪除
logicsugar.hint.datacall.vector_erase = vector_erase(list, index)：list 是已宣告的清單，index 是元素索引；刪除該元素並將被刪值寫入 result，無效時為 NaN。
logicsugar.datacall.vector_find = 尋找
logicsugar.hint.datacall.vector_find = vector_find(list, value)：list 是已宣告的清單，value 是目標值；將第一個符合索引寫入 result，找不到時為 -1。
logicsugar.datacall.vector_size = 大小
logicsugar.hint.datacall.vector_size = vector_size(list)：list 是已宣告的清單；將目前元素數量寫入 result。
logicsugar.datacall.heap_push = 推入
logicsugar.hint.datacall.heap_push = heap_push(heap, value)：heap 是已宣告的小頂堆，value 插入堆中；成功向 result 寫入 1；已滿不寫入，result 為 -1。
logicsugar.datacall.heap_pop = 彈出
logicsugar.hint.datacall.heap_pop = heap_pop(heap)：heap 是已宣告的小頂堆；移除最小值並將其寫入 result，空堆時為 NaN。
logicsugar.datacall.heap_size = 大小
logicsugar.hint.datacall.heap_size = heap_size(heap)：heap 是已宣告的小頂堆；將目前元素數量寫入 result。
logicsugar.datacall.map_set = 寫入
logicsugar.hint.datacall.map_set = map_set(map, key, value)：map 是已宣告的雜湊表，key 是數字鍵，value 是要儲存的值；成功向 result 寫入 1，滿表或無效鍵寫入 -1。
logicsugar.datacall.map_get = 讀取
logicsugar.hint.datacall.map_get = map_get(map, key)：map 是已宣告的雜湊表，key 是數字鍵；將儲存值寫入 result，不存在時為 NaN。
logicsugar.datacall.map_contains = 存在性
logicsugar.hint.datacall.map_contains = map_contains(map, key)：map 是已宣告的雜湊表，key 是數字鍵；存在時向 result 寫入 1，否則寫入 0。
logicsugar.datacall.map_erase = 刪除
logicsugar.hint.datacall.map_erase = map_erase(map, key)：map 是已宣告的雜湊表，key 是數字鍵；刪除鍵：成功向 result 寫入 1，鍵不存在寫入 -1。
logicsugar.datacall.map_size = 大小
logicsugar.hint.datacall.map_size = map_size(map)：map 是已宣告的雜湊表；將目前儲存的鍵數量寫入 result。
logicsugar.datacall.map_clear = 清空
logicsugar.hint.datacall.map_clear = map_clear(map)：map 是已宣告的雜湊表；清空所有鍵槽，使其可以開始使用。此積木沒有回傳值。
logicsugar.datacall.set_add = 加入
logicsugar.hint.datacall.set_add = set_add(set, key)：set 是已宣告的集合，key 是數字成員；插入成員，並將成功 1 或已滿／無效鍵 -1 寫入 result。
logicsugar.datacall.set_contains = 存在性
logicsugar.hint.datacall.set_contains = set_contains(set, key)：set 是已宣告的集合，key 是數字成員；存在時向 result 寫入 1，否則寫入 0。
logicsugar.datacall.set_remove = 刪除
logicsugar.hint.datacall.set_remove = set_remove(set, key)：set 是已宣告的集合，key 是數字成員；刪除成員：成功向 result 寫入 1，成員不存在寫入 -1。
logicsugar.datacall.set_size = 大小
logicsugar.hint.datacall.set_size = set_size(set)：set 是已宣告的集合；將目前成員數量寫入 result。
logicsugar.datacall.set_clear = 清空
logicsugar.hint.datacall.set_clear = set_clear(set)：set 是已宣告的集合；清空所有成員槽，使其可以開始使用。此積木沒有回傳值。
logicsugar.datacall.chain_init = 初始化
logicsugar.hint.datacall.chain_init = chain_init(chain)：chain 是已宣告的鏈結串列；重建空閒節點鏈，並將容量寫入 result。
logicsugar.datacall.chain_clear = 重設
logicsugar.hint.datacall.chain_clear = chain_clear(chain)：chain 是已宣告的鏈結串列；重設鏈結串列與空閒節點鏈，並將容量寫入 result。
logicsugar.datacall.chain_alloc = 配置節點
logicsugar.hint.datacall.chain_alloc = chain_alloc(chain)：chain 是已宣告的鏈結串列；配置空閒節點，將 next 設為 -1，並將節點索引寫入 result；沒有空閒節點時為 -1。
logicsugar.datacall.chain_free = 釋放節點
logicsugar.hint.datacall.chain_free = chain_free(chain, index)：chain 是已宣告的鏈結串列，index 是節點索引；釋放節點並掛回空閒鏈，成功向 result 寫入 1，無效索引寫入 -1。
logicsugar.datacall.chain_get = 讀取節點值
logicsugar.hint.datacall.chain_get = chain_get(chain, index)：chain 是已宣告的鏈結串列，index 是節點索引；將節點值寫入 result，越界時為 NaN。
logicsugar.datacall.chain_set = 寫入節點值
logicsugar.hint.datacall.chain_set = chain_set(chain, index, value)：chain 是已宣告的鏈結串列，index 是節點索引，value 是要寫入的值；成功向 result 寫入 1；越界不寫入，result 為 -1。
logicsugar.datacall.chain_next = 下一個節點
logicsugar.hint.datacall.chain_next = chain_next(chain, index)：chain 是已宣告的鏈結串列，index 是節點索引；將節點的 next 索引寫入 result，越界時為 -1。
logicsugar.datacall.chain_link = 連結節點
logicsugar.hint.datacall.chain_link = chain_link(chain, index, next)：chain 是已宣告的鏈結串列，index 是要修改 next 的節點索引，next 是目標索引（-1 表示鏈尾）；成功向 result 寫入 1，index 無效寫入 -1。
logicsugar.datacall.chain_set_head = 設定頭
logicsugar.hint.datacall.chain_set_head = chain_set_head(chain, index)：chain 是已宣告的鏈結串列，index 是新的頭節點值；直接設定頭節點且不驗證，並將 1 寫入 result。
logicsugar.datacall.chain_head = 讀取頭
logicsugar.hint.datacall.chain_head = chain_head(chain)：chain 是已宣告的鏈結串列；將目前頭節點索引寫入 result。
logicsugar.datacall.chain_len = 長度
logicsugar.hint.datacall.chain_len = chain_len(chain)：chain 是已宣告的鏈結串列；從頭節點遍歷，並將可到達節點數量寫入 result。
logicsugar.datacall.bitset_set = 設定位元
logicsugar.hint.datacall.bitset_set = bitset_set(bits, index)：bits 是已宣告的位集，index 是位索引；設定該位元並將 1 寫入 result（越界不修改但仍回傳 1）。
logicsugar.datacall.bitset_reset = 清除位元
logicsugar.hint.datacall.bitset_reset = bitset_reset(bits, index)：bits 是已宣告的位集，index 是位索引；清除該位元並將 1 寫入 result（越界不修改但仍回傳 1）。
logicsugar.datacall.bitset_test = 測試位元
logicsugar.hint.datacall.bitset_test = bitset_test(bits, index)：bits 是已宣告的位集，index 是位索引；將該位是否為 1（1/0）寫入 result。
logicsugar.datacall.bitset_count = 統計位元數
logicsugar.hint.datacall.bitset_count = bitset_count(bits)：bits 是已宣告的位集；將所有已設定位元的數量寫入 result。
logicsugar.datacall.array_sum = 求和
logicsugar.hint.datacall.array_sum = array_sum(buf)：buf 是已宣告的陣列或矩陣；將所有元素總和寫入積木左側結果變數（預設為 result）。
logicsugar.datacall.array_avg = 平均值
logicsugar.hint.datacall.array_avg = array_avg(buf)：buf 是已宣告的陣列或矩陣；將算術平均值寫入結果變數（預設為 result）。
logicsugar.datacall.array_min = 最小值
logicsugar.hint.datacall.array_min = array_min(buf)：buf 是已宣告的陣列或矩陣；將最小元素寫入結果變數（預設為 result）。
logicsugar.datacall.array_max = 最大值
logicsugar.hint.datacall.array_max = array_max(buf)：buf 是已宣告的陣列或矩陣；將最大元素寫入結果變數（預設為 result）。
logicsugar.datacall.array_count = 比對計數
logicsugar.hint.datacall.array_count = array_count(buf, value)：buf 是已宣告的陣列或矩陣，value 是要比較的值；將符合數量寫入結果變數（預設為 result）。
logicsugar.datacall.array_find = 尋找索引
logicsugar.hint.datacall.array_find = array_find(buf, value)：buf 是已宣告的陣列或矩陣，value 是目標值；將第一個符合索引寫入 result，找不到時為 -1。
logicsugar.datacall.array_fill = 填充
logicsugar.hint.datacall.array_fill = array_fill(buf, value)：buf 是已宣告的陣列或矩陣，value 會寫入每個元素。此積木沒有回傳值。
logicsugar.datacall.array_copy = 複製
logicsugar.hint.datacall.array_copy = array_copy(dst, src)：dst 是已宣告的目標陣列，src 是已宣告的來源陣列；複製全部元素。此積木沒有回傳值。
logicsugar.datacall.array_sort = 升冪排序
logicsugar.hint.datacall.array_sort = array_sort(buf)：buf 是已宣告的陣列或矩陣；原地升冪排序。此積木沒有回傳值。
logicsugar.datacall.array_sort_desc = 降冪排序
logicsugar.hint.datacall.array_sort_desc = array_sort_desc(buf)：buf 是已宣告的陣列或矩陣；原地降冪排序。此積木沒有回傳值。
logicsugar.datacall.array_reverse = 反轉
logicsugar.hint.datacall.array_reverse = array_reverse(buf)：buf 是已宣告的陣列或矩陣；原地反轉元素。此積木沒有回傳值。
logicsugar.datacall.array_replace = 取代符合項
logicsugar.hint.datacall.array_replace = array_replace(buf, oldValue, newValue)：buf 是已宣告的陣列或矩陣，oldValue 是要尋找的值，newValue 是取代值；將取代次數寫入 result。
logicsugar.datacall.array_swap = 交換元素
logicsugar.hint.datacall.array_swap = array_swap(buf, i, j)：buf 是已宣告的陣列或矩陣，i 和 j 是元素索引；交換兩個元素。此積木沒有回傳值。
logicsugar.datacall.array_lower_bound = 二分搜尋
logicsugar.hint.datacall.array_lower_bound = array_lower_bound(buf, value)：buf 是已按升冪排列的陣列或矩陣，value 是目標值；將目標索引寫入 result，找不到時為 -1。

