# ===== 可持久化資料 intrinsic 積木 =====
logicsugar.datacall.operation = 操作
logicsugar.datacall.arguments = 以逗號分隔的引數
logicsugar.hint.datacall.operation = 固定的資料結構操作；要更換操作，請從對應分類加入另一塊積木。
logicsugar.hint.datacall.arguments = 依函式順序填寫引數，多個引數以逗號分隔。
logicsugar.lst.datacall = 可持久化的資料結構操作積木；編譯時依對應 intrinsic 降級。
logicsugar.datacall.sum = 求和
logicsugar.lst.datacall.sum = sum(buf)：buf 是已宣告的陣列或矩陣；將所有元素總和寫入積木左側結果變數（預設為 result）。
logicsugar.datacall.avg = 平均值
logicsugar.lst.datacall.avg = avg(buf)：buf 是已宣告的陣列或矩陣；將算術平均值寫入結果變數（預設為 result）。
logicsugar.datacall.min = 最小值
logicsugar.lst.datacall.min = min(buf)：buf 是已宣告的陣列或矩陣；將最小元素寫入結果變數（預設為 result）。
logicsugar.datacall.max = 最大值
logicsugar.lst.datacall.max = max(buf)：buf 是已宣告的陣列或矩陣；將最大元素寫入結果變數（預設為 result）。
logicsugar.datacall.count = 比對計數
logicsugar.lst.datacall.count = count(buf, value)：buf 是已宣告的陣列或矩陣，value 是要比較的值；將符合數量寫入結果變數（預設為 result）。
logicsugar.datacall.indexof = 尋找索引
logicsugar.lst.datacall.indexof = indexof(buf, value)：buf 是已宣告的陣列或矩陣，value 是目標值；將第一個符合索引寫入 result，找不到時為 -1。
logicsugar.datacall.fill = 填充
logicsugar.lst.datacall.fill = fill(buf, value)：buf 是已宣告的陣列或矩陣，value 會寫入每個元素。此積木沒有回傳值。
logicsugar.datacall.copy = 複製
logicsugar.lst.datacall.copy = copy(dst, src)：dst 是已宣告的目標陣列，src 是已宣告的來源陣列；複製全部元素。此積木沒有回傳值。
logicsugar.datacall.sortasc = 升冪排序
logicsugar.lst.datacall.sortasc = sortasc(buf)：buf 是已宣告的陣列或矩陣；原地升冪排序。此積木沒有回傳值。
logicsugar.datacall.sortdesc = 降冪排序
logicsugar.lst.datacall.sortdesc = sortdesc(buf)：buf 是已宣告的陣列或矩陣；原地降冪排序。此積木沒有回傳值。
logicsugar.datacall.reverse = 反轉
logicsugar.lst.datacall.reverse = reverse(buf)：buf 是已宣告的陣列或矩陣；原地反轉元素。此積木沒有回傳值。
logicsugar.datacall.replace = 取代符合項
logicsugar.lst.datacall.replace = replace(buf, oldValue, newValue)：buf 是已宣告的陣列或矩陣，oldValue 是要尋找的值，newValue 是取代值；將取代次數寫入 result。
logicsugar.datacall.swap = 交換元素
logicsugar.lst.datacall.swap = swap(buf, i, j)：buf 是已宣告的陣列或矩陣，i 和 j 是元素索引；交換兩個元素。此積木沒有回傳值。
logicsugar.datacall.bsearch = 二分搜尋
logicsugar.lst.datacall.bsearch = bsearch(buf, value)：buf 是已按升冪排列的陣列或矩陣，value 是目標值；將目標索引寫入 result，找不到時為 -1。
logicsugar.datacall.spush = 推入
logicsugar.lst.datacall.spush = spush(s, value)：s 是已宣告的堆疊，value 是要推入的值；將推入後的堆疊長度寫入 result（堆疊已滿時維持原長度）。
logicsugar.datacall.spop = 彈出
logicsugar.lst.datacall.spop = spop(s)：s 是已宣告的堆疊；移除堆疊頂端，並將其值寫入 result（空堆疊回傳 NaN）。
logicsugar.datacall.speek = 查看頂端
logicsugar.lst.datacall.speek = speek(s)：s 是已宣告的堆疊；讀取堆疊頂端但不移除，並將值寫入 result（空堆疊回傳 NaN）。
logicsugar.datacall.ssize = 大小
logicsugar.lst.datacall.ssize = ssize(s)：s 是已宣告的堆疊；將目前元素數量寫入 result。
logicsugar.datacall.sclear = 清空
logicsugar.lst.datacall.sclear = sclear(s)：s 是已宣告的堆疊；清空內容與隱藏堆疊頂端計數。此積木沒有回傳值。
logicsugar.datacall.qpush = 入列
logicsugar.lst.datacall.qpush = qpush(q, value)：q 是已宣告的佇列，value 會追加到佇列尾端；將推入後長度寫入 result（佇列已滿時維持原長度）。
logicsugar.datacall.qpop = 出列
logicsugar.lst.datacall.qpop = qpop(q)：q 是已宣告的佇列；移除佇列前端，並將其值寫入 result（空佇列回傳 NaN）。
logicsugar.datacall.qpeek = 查看前端
logicsugar.lst.datacall.qpeek = qpeek(q)：q 是已宣告的佇列；讀取佇列前端但不移除，並將值寫入 result（空佇列回傳 NaN）。
logicsugar.datacall.qsize = 大小
logicsugar.lst.datacall.qsize = qsize(q)：q 是已宣告的佇列；將目前元素數量寫入 result。
logicsugar.datacall.qclear = 清空
logicsugar.lst.datacall.qclear = qclear(q)：q 是已宣告的佇列；清空內容與 head/tail/count 狀態。此積木沒有回傳值。
logicsugar.datacall.dpushf = 前端推入
