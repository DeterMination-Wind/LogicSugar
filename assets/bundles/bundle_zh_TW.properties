logicsugar.hint.if.condition = if 分支的條件式，為真時執行分支內容。
logicsugar.hint.elif = 當前面的 if/elif 不成立時檢查的替代條件。
logicsugar.hint.switch.value = 與下方各 case 比較的運算式，命中首個匹配的 case 並執行其分支內容。
logicsugar.hint.case = 與 switch 運算式比較的值，首個匹配的 case 執行其分支內容。
logicsugar.hint.default = 所有未命中 case 的值走這裡。跳轉表裡它是空槽的目標；帶邊界保護的形態下，越界值也會落到這裡。
logicsugar.hint.switch.stride = 從手寫 mlog 恢復的步長 @counter switch。每個 case 是固定長度的槽，派發是先乘再寫入 @counter，所以 case 的指令數就是跳轉的一部分。選板不會新建這種形態。
logicsugar.hint.switch.raw = 跳轉表形態，點擊切換。帶邊界（預設）：@counter += 切換值 加兩條邊界守衛，再按槽位發跳轉行，越界值會落到 default 分支。裸表：只發派發加槽位行、不做邊界檢查——手寫與第三方工具產生的跳轉表就是這個形態，恢復時保持原樣才能逐條一致；此時越界值不會被夾回，會派發到表外。選板新建的 switch 一律是帶邊界形態。
logicsugar.hint.func.def = 定義函式：函式內容被所有呼叫點共用。
logicsugar.hint.func.call = 呼叫函式：函式內容如同貼在此處執行。
logicsugar.hint.func.return = 結束目前函式呼叫；可攜帶回傳值回到呼叫點。
logicsugar.hint.while.condition = 迴圈條件，為真時重複執行迴圈內容。
logicsugar.hint.for.variable = 迴圈變數，從初值開始依步長遞增。
logicsugar.hint.for.initial = 迴圈變數的起始值。
logicsugar.hint.for.step = 每次迭代加給迴圈變數的值。
logicsugar.hint.for.condition = 迴圈變數的比較條件，滿足時繼續迴圈。
logicsugar.hint.array.name = 表達式中用下標存取的陣列名，如 buf[i]。必須是合法識別碼且全程式唯一。
logicsugar.hint.array.memory = 承載資料的記憶體方塊變數，如 cell1。同一記憶體方塊上宣告的陣列區間不可重疊。
logicsugar.hint.array.base = 陣列在記憶體方塊上的起始實體位址；非負整數字面量。
logicsugar.hint.array.size = 陣列元素個數；至少為 1 的整數。越界下標保持原版記憶體語義。
logicsugar.lst.forbegin = for 迴圈：變數從初值依步長遞增，滿足條件時持續迴圈。
logicsugar.lst.whilebegin = while 迴圈：條件為真時重複執行迴圈內容。
logicsugar.lst.switchbegin = switch 分支：將運算式與下方各 case 比較，執行首個匹配項。
logicsugar.lst.case = case 標籤：與 switch 運算式匹配的值。
logicsugar.lst.default = 預設分支標籤：沒有任何 case 匹配時執行。
logicsugar.lst.ifbegin = if 分支：條件為真時執行分支內容。
logicsugar.lst.elseif = elif 分支：當前面的 if/elif 不成立時檢查的替代條件。
logicsugar.lst.else = else 分支：前面所有條件都不成立時執行。
logicsugar.lst.funcdef = 函式定義：宣告帶參數的可呼叫函式。
logicsugar.lst.funccall = 函式呼叫：在目前位置執行函式內容，可選擇儲存回傳值。
logicsugar.lst.return = 回傳：結束目前函式呼叫，可攜帶回傳值。
logicsugar.lst.break = 跳出：退出最近的迴圈或 switch。
logicsugar.lst.continue = 繼續：跳到最近迴圈的下一次迭代。
logicsugar.lst.blockend = 結束：閉合最近的未閉合區塊。
logicsugar.lst.array = 陣列：把記憶體的一段位址登記為命名陣列，讓表達式能用 buf[i] 下標讀寫。
logicsugar.lst.assertbounds = 複雜斷言不成立時，停止該處理器的執行。
logicsugar.lst.assertequals = 變數與期望值不一致時，停止該處理器的執行。
logicsugar.lst.assertflush = 為執行 assertprints 指令記錄目前列印緩衝位置。
logicsugar.lst.assertprints = 列印緩衝內容與期望值不一致時，停止該處理器的執行。
logicsugar.lst.asserttype = 變數的實際類型與期望類型不符時，停止該處理器的執行。
logicsugar.lst.error = 顯示錯誤訊息並停止該處理器的執行。
logicsugar.lst.log = 按指定層級把一則訊息寫入遊戲日誌檔。
logicsugar.lst.breakpoint = 條件滿足時暫停該處理器與整個遊戲。
