setting.logicsugar.assertEmit.name = 除錯斷言建置
setting.logicsugar.assertEmit.description = 僅限單機/地圖編輯器：開啟後，斷言卡片會作為真實指令保存進處理器（breakpoint 暫停遊戲，斷言失敗在原地自旋並顯示訊息；開啟「斷言失敗即斷點」時改為在失敗指令處暫停）。原版用戶端無法解析這些行，連線（加入或自建）時編譯器一律強制剝離斷言；單機建立的除錯建置同樣切勿分享給原版用戶端——無論開關與否，斷言都隨原始碼載體一同保存。
setting.logicsugar.disableBreakpoints.name = 停用斷點
setting.logicsugar.disableBreakpoints.description = 斷點不再中斷執行，程式直接繼續下一條指令。開啟「斷言失敗即斷點」時，失敗的斷言也會被忽略。
setting.logicsugar.assertsAreBreakpoints.name = 斷言失敗即斷點
setting.logicsugar.assertsAreBreakpoints.description = 開啟後，斷言失敗會在失敗指令處暫停遊戲（而不是在原地自旋）。若斷點已停用，斷言將被完全忽略。
setting.logicsugar.detachCameraOnBreakpoint.name = 斷點分離視角
setting.logicsugar.detachCameraOnBreakpoint.description = 命中斷點時把視角居中到處理器並暫時分離視角，避免取消暫停後視角立刻跳走。取消暫停時恢復原本的視角設定。
setting.logicsugar.waitIndication.name = 顯示等待超過（秒）
setting.logicsugar.waitIndication.description = 處理器執行超過該閾值的 wait 指令時，在其上繪製進度圓環。設為 0 完全關閉等待指示。
setting.logicsugar.processorScan.name = 每幀掃描處理器數
setting.logicsugar.processorScan.description = 每幀檢查多少個處理器來發現停止/等待狀態。處理器極多的地圖若因此卡頓可以調低。
setting.logicsugar.warnEffect.name = 視覺警告
setting.logicsugar.warnEffect.description = 用地圖特效提醒停止或執行失敗的處理器：從不、出現失敗時一次，或每 n 秒循環一次。
setting.logicsugar.showUnitFlags.name = 顯示單位 flag
setting.logicsugar.showUnitFlags.description = 在每個單位正上方用紅色顯示其邏輯 flag。flag 為預設值 0 的單位不顯示。純展示：不影響邏輯執行、存檔與連線同步。
