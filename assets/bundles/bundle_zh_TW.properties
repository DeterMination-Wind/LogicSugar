setting.logicsugar.funcMode.name = 函式模式
setting.logicsugar.funcMode.description = 函式呼叫的編譯方式：一般模式會讓每個函式共用一個子程序（@counter）；內嵌模式會將函式主體複製到每個呼叫位置。
setting.logicsugar.maxInstructions.name = 指令數上限
setting.logicsugar.maxInstructions.description = 用戶端覆蓋邏輯處理器的指令上限（原版 1000）。調高後可以放下除錯程式碼，也讓大型 Logic Sugar 程式的原始碼載體不再因超限而被丟棄儲存。僅本機生效，不影響其他用戶端。
setting.logicsugar.waitIndication.name = 顯示等待超過（秒）
setting.logicsugar.waitIndication.description = 處理器執行超過該閾值的 wait 指令時，在其上繪製進度圓環。設為 0 完全關閉等待指示。
setting.logicsugar.processorScan.name = 每幀掃描處理器數
setting.logicsugar.processorScan.description = 每幀檢查多少個處理器來發現停止/等待狀態。處理器極多的地圖若因此卡頓可以調低。
setting.logicsugar.warnEffect.name = 視覺警告
setting.logicsugar.warnEffect.description = 用地圖特效提醒停止或執行失敗的處理器：從不、出現失敗時一次，或每 n 秒循環一次。
logicsugar.off = 關
logicsugar.stoppedAt = 已停在第 {0} 條
logicsugar.warn.never = 從不
logicsugar.warn.once = 一次
logicsugar.warn.every = 每 {0} 秒
setting.logicsugar.hideVars.name = 在變數瀏覽器中隱藏內部變數
setting.logicsugar.hideVars.description = 在 MindustryX 邏輯輔助面板（變數瀏覽器）中隱藏 Logic Sugar 編譯產生的內部變數（__ls_ 函式/載體變數、_0/_1 表達式暫存變數）。僅影響顯示，不影響邏輯執行、存檔與網路同步。
setting.logicsugar.ctrlClickCopy.name = Ctrl+點擊 = 複製積木
setting.logicsugar.ctrlClickCopy.description = 按住 Ctrl 點擊積木會選取它並立即開始複製拖曳。關閉後 Ctrl+點擊退化為一般點擊（移動拖曳）。
setting.logicsugar.ctrlDragCopy.name = Ctrl+拖曳 = 複製積木
setting.logicsugar.ctrlDragCopy.description = 拖曳積木時按住 Ctrl 會複製而非移動。關閉後 Ctrl+拖曳退化為一般移動拖曳。中鍵複製不受影響。
setting.logicsugar.dragExpandSpacing.name = 拖曳時擴展間距
setting.logicsugar.dragExpandSpacing.description = 拖曳時暫時把積木間距擴到 10 單位，方便閱讀與選取。關閉後拖曳全程保持間距不變——徹底解決視野/虛擬預覽偏移問題（折疊語句區塊內部也不會被拖入）。
setting.logicsugar.compactCards.name = 緊湊卡片佈局
setting.logicsugar.compactCards.description = 去除語句卡片之間的間距，讓一屏顯示更多語句。關閉後恢復原版的卡片間距。
