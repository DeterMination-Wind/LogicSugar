setting.logicsugar.colorizeUnitFlags.description = 為每個不同的單位 flag 使用不同的鮮明顏色。前 10 個 flag 優先使用內建高對比度配色，更多 flag 隨機分配鮮明顏色。純展示：不影響邏輯執行、存檔與連線同步。
