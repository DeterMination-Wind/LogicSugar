logicsugar.funclib.edit.hint = 函式庫會在邏輯處理器編輯器中編輯。開啟時會將函式庫載入編輯器；新增、修改或移除函式的方式與一般處理器程式相同。關閉編輯器時會自動驗證並儲存函式庫。儲存失敗時，編輯器會重新開啟並保留你的工作。
