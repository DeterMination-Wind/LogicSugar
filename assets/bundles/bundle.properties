logicsugar.datacall.replace = Replace matches
logicsugar.lst.datacall.replace = replace(buf, oldValue, newValue): buf is the declared array or matrix; oldValue is the value to find and newValue is the replacement; writes the replacement count to result.
logicsugar.datacall.swap = Swap elements
