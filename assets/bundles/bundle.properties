logicsugar.conflict.takeover = Took the logic editor over from "{0}". That mod's editor UI is now detached - switch the Logic editor conflict setting to "step aside" to hand it back.
logicsugar.conflict.stepaside = "{0}" owns the logic editor, so LogicSugar's editor and sugar language are disabled. Set the Logic editor conflict setting to "take over" to use LogicSugar instead.
logicsugar.conflict.coexist = Mod "{0}" draws the logic editor, and LogicSugar's canvas runs inside it. That mod's panels keep working, and sugar statements compile as usual.
logicsugar.conflict.coexistfailed = Could not place LogicSugar's canvas inside "{0}"'s editor, so LogicSugar took the editor over instead.
logicsugar.coexist.failed = Compile failed, so the processor keeps its previous program.\n{0}
