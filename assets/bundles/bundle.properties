logicsugar.datacall.array_find = Find index
logicsugar.lst.datacall.array_find = array_find(buf, value): buf is the declared array or matrix and value is the target; writes the first matching index, or -1 when absent, to result.
logicsugar.hint.datacall.array_find = array_find(buf, value): buf is the declared array or matrix and value is the target; writes the first matching index, or -1 when absent, to result.
