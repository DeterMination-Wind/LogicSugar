logicsugar.lst.datacall.group.stackops = Stack Operations: Push, Pop, Peek, Size, Clear. Switch inside the card.
logicsugar.lst.datacall.group.queueops = Queue Operations: Push, Pop, Peek, Size, Clear. Switch inside the card.
logicsugar.lst.datacall.group.dequeops = Deque Operations: Push front, Push back, Pop front, Pop back, and 4 more. Switch inside the card.
logicsugar.lst.datacall.group.bitsetops = Bitset Operations: Set, Clear, Test, Count. Switch inside the card.
logicsugar.lst.datacall.group.mapops = Hash Map Operations: Set, Get, Contains, Delete, Size, Clear. Switch inside the card.
logicsugar.lst.datacall.group.setops = Set Operations: Add, Contains, Delete, Size, Clear. Switch inside the card.
logicsugar.lst.datacall.group.listops = List Operations: Append, Get, Set, Insert, and 3 more. Switch inside the card.
logicsugar.lst.datacall.group.heapops = Heap Operations: Push, Pop, Size. Switch inside the card.
