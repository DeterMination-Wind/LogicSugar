logicsugar.datacall.sortasc = Sort ascending
logicsugar.lst.datacall.sortasc = sortasc(buf): buf is the declared array or matrix; sorts it in ascending order in place. This card has no result value.
logicsugar.datacall.sortdesc = Sort descending
logicsugar.lst.datacall.sortdesc = sortdesc(buf): buf is the declared array or matrix; sorts it in descending order in place. This card has no result value.
logicsugar.datacall.reverse = Reverse
