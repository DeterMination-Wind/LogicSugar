logicsugar.lst.datacall.deque_push_back = deque_push_back(d, value): d is the declared deque and value is inserted at the back; writes the new deque length to result, or -1 when the deque is full (nothing is inserted).
logicsugar.hint.datacall.deque_push_back = deque_push_back(d, value): d is the declared deque and value is inserted at the back; writes the new deque length to result, or -1 when the deque is full (nothing is inserted).
logicsugar.datacall.deque_pop_front = Pop front
logicsugar.lst.datacall.deque_pop_front = deque_pop_front(d): d is the declared deque; removes the front value and writes it to result (empty returns NaN).
logicsugar.hint.datacall.deque_pop_front = deque_pop_front(d): d is the declared deque; removes the front value and writes it to result (empty returns NaN).
logicsugar.datacall.deque_pop_back = Pop back
logicsugar.lst.datacall.deque_pop_back = deque_pop_back(d): d is the declared deque; removes the back value and writes it to result (empty returns NaN).
logicsugar.hint.datacall.deque_pop_back = deque_pop_back(d): d is the declared deque; removes the back value and writes it to result (empty returns NaN).
logicsugar.datacall.deque_front = Peek front
logicsugar.lst.datacall.deque_front = deque_front(d): d is the declared deque; reads the front value without removing it and writes it to result (empty returns NaN).
logicsugar.hint.datacall.deque_front = deque_front(d): d is the declared deque; reads the front value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.deque_back = Peek back
logicsugar.lst.datacall.deque_back = deque_back(d): d is the declared deque; reads the back value without removing it and writes it to result (empty returns NaN).
logicsugar.hint.datacall.deque_back = deque_back(d): d is the declared deque; reads the back value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.deque_size = Size
logicsugar.lst.datacall.deque_size = deque_size(d): d is the declared deque; writes its current element count to result.
logicsugar.hint.datacall.deque_size = deque_size(d): d is the declared deque; writes its current element count to result.
logicsugar.datacall.deque_clear = Clear
logicsugar.lst.datacall.deque_clear = deque_clear(d): d is the declared deque; clears its contents and head/tail/count state. This card has no result value.
logicsugar.hint.datacall.deque_clear = deque_clear(d): d is the declared deque; clears its contents and head/tail/count state. This card has no result value.
logicsugar.datacall.vector_push_back = Append
logicsugar.lst.datacall.vector_push_back = vector_push_back(list, value): list is the declared list and value is appended; writes the new list length to result, or -1 when the list is full (nothing is appended).
logicsugar.hint.datacall.vector_push_back = vector_push_back(list, value): list is the declared list and value is appended; writes the new list length to result, or -1 when the list is full (nothing is appended).
logicsugar.datacall.vector_at = Get
logicsugar.lst.datacall.vector_at = vector_at(list, index): list is the declared list and index is the element index; writes that element to result, or NaN when out of range.
logicsugar.hint.datacall.vector_at = vector_at(list, index): list is the declared list and index is the element index; writes that element to result, or NaN when out of range.
logicsugar.datacall.vector_set = Set
logicsugar.lst.datacall.vector_set = vector_set(list, index, value): list is the declared list, index is the element index and value is stored there; writes 1 on success, or -1 when out of range (nothing is written).
logicsugar.hint.datacall.vector_set = vector_set(list, index, value): list is the declared list, index is the element index and value is stored there; writes 1 on success, or -1 when out of range (nothing is written).
logicsugar.datacall.vector_insert = Insert
logicsugar.lst.datacall.vector_insert = vector_insert(list, index, value): list is the declared list, index is the insertion position and value is inserted there; writes 1 on success, or -1 on invalid/full (nothing is inserted).
logicsugar.hint.datacall.vector_insert = vector_insert(list, index, value): list is the declared list, index is the insertion position and value is inserted there; writes 1 on success, or -1 on invalid/full (nothing is inserted).
logicsugar.datacall.vector_erase = Remove
logicsugar.lst.datacall.vector_erase = vector_erase(list, index): list is the declared list and index is the element index; removes it and writes the removed value to result, or NaN when invalid.
logicsugar.hint.datacall.vector_erase = vector_erase(list, index): list is the declared list and index is the element index; removes it and writes the removed value to result, or NaN when invalid.
logicsugar.datacall.vector_find = Find
logicsugar.lst.datacall.vector_find = vector_find(list, value): list is the declared list and value is the target; writes the first matching index, or -1 when absent, to result.
logicsugar.hint.datacall.vector_find = vector_find(list, value): list is the declared list and value is the target; writes the first matching index, or -1 when absent, to result.
logicsugar.datacall.vector_size = Size
logicsugar.lst.datacall.vector_size = vector_size(list): list is the declared list; writes its current element count to result.
logicsugar.hint.datacall.vector_size = vector_size(list): list is the declared list; writes its current element count to result.
logicsugar.datacall.heap_push = Push
logicsugar.lst.datacall.heap_push = heap_push(heap, value): heap is the declared min-heap and value is inserted; writes 1 on success, or -1 when full (nothing is inserted).
logicsugar.hint.datacall.heap_push = heap_push(heap, value): heap is the declared min-heap and value is inserted; writes 1 on success, or -1 when full (nothing is inserted).
logicsugar.datacall.heap_pop = Pop
logicsugar.lst.datacall.heap_pop = heap_pop(heap): heap is the declared min-heap; removes the smallest value and writes it to result, or NaN when empty.
logicsugar.hint.datacall.heap_pop = heap_pop(heap): heap is the declared min-heap; removes the smallest value and writes it to result, or NaN when empty.
logicsugar.datacall.heap_size = Size
logicsugar.lst.datacall.heap_size = heap_size(heap): heap is the declared min-heap; writes its current element count to result.
logicsugar.hint.datacall.heap_size = heap_size(heap): heap is the declared min-heap; writes its current element count to result.
logicsugar.datacall.map_set = Set
logicsugar.lst.datacall.map_set = map_set(map, key, value): map is the declared hash map, key is the numeric key and value is stored for it; writes 1 on success or -1 when full/invalid to result.
logicsugar.hint.datacall.map_set = map_set(map, key, value): map is the declared hash map, key is the numeric key and value is stored for it; writes 1 on success or -1 when full/invalid to result.
logicsugar.datacall.map_get = Get
logicsugar.lst.datacall.map_get = map_get(map, key): map is the declared hash map and key is the numeric key; writes its stored value to result, or NaN if absent.
logicsugar.hint.datacall.map_get = map_get(map, key): map is the declared hash map and key is the numeric key; writes its stored value to result, or NaN if absent.
logicsugar.datacall.map_contains = Contains
logicsugar.lst.datacall.map_contains = map_contains(map, key): map is the declared hash map and key is the numeric key; writes 1 if present, otherwise 0, to result.
logicsugar.hint.datacall.map_contains = map_contains(map, key): map is the declared hash map and key is the numeric key; writes 1 if present, otherwise 0, to result.
logicsugar.datacall.map_erase = Delete
logicsugar.lst.datacall.map_erase = map_erase(map, key): map is the declared hash map and key is the numeric key; deletes it and writes 1 when deleted, or -1 when the key is missing.
logicsugar.hint.datacall.map_erase = map_erase(map, key): map is the declared hash map and key is the numeric key; deletes it and writes 1 when deleted, or -1 when the key is missing.
logicsugar.datacall.map_size = Size
logicsugar.lst.datacall.map_size = map_size(map): map is the declared hash map; writes the number of stored keys to result.
logicsugar.hint.datacall.map_size = map_size(map): map is the declared hash map; writes the number of stored keys to result.
logicsugar.datacall.map_clear = Clear
logicsugar.lst.datacall.map_clear = map_clear(map): map is the declared hash map; clears all key slots so it is ready for use. This card has no result value.
logicsugar.hint.datacall.map_clear = map_clear(map): map is the declared hash map; clears all key slots so it is ready for use. This card has no result value.
logicsugar.datacall.set_add = Add
logicsugar.lst.datacall.set_add = set_add(set, key): set is the declared set and key is the numeric member; inserts it and writes 1 on success or -1 when full/invalid to result.
logicsugar.hint.datacall.set_add = set_add(set, key): set is the declared set and key is the numeric member; inserts it and writes 1 on success or -1 when full/invalid to result.
logicsugar.datacall.set_contains = Contains
logicsugar.lst.datacall.set_contains = set_contains(set, key): set is the declared set and key is the numeric member; writes 1 if present, otherwise 0, to result.
logicsugar.hint.datacall.set_contains = set_contains(set, key): set is the declared set and key is the numeric member; writes 1 if present, otherwise 0, to result.
logicsugar.datacall.set_remove = Delete
logicsugar.lst.datacall.set_remove = set_remove(set, key): set is the declared set and key is the numeric member; deletes it and writes 1 when deleted, or -1 when the member is missing.
logicsugar.hint.datacall.set_remove = set_remove(set, key): set is the declared set and key is the numeric member; deletes it and writes 1 when deleted, or -1 when the member is missing.
logicsugar.datacall.set_size = Size
logicsugar.lst.datacall.set_size = set_size(set): set is the declared set; writes the number of members to result.
logicsugar.hint.datacall.set_size = set_size(set): set is the declared set; writes the number of members to result.
logicsugar.datacall.set_clear = Clear
logicsugar.lst.datacall.set_clear = set_clear(set): set is the declared set; clears all member slots so it is ready for use. This card has no result value.
logicsugar.hint.datacall.set_clear = set_clear(set): set is the declared set; clears all member slots so it is ready for use. This card has no result value.
logicsugar.datacall.chain_init = Initialize
logicsugar.lst.datacall.chain_init = chain_init(chain): chain is the declared linked list; rebuilds the free-node chain and writes its capacity to result.
logicsugar.hint.datacall.chain_init = chain_init(chain): chain is the declared linked list; rebuilds the free-node chain and writes its capacity to result.
logicsugar.datacall.chain_clear = Reset
logicsugar.lst.datacall.chain_clear = chain_clear(chain): chain is the declared linked list; resets the list/free-node chain and writes its capacity to result.
logicsugar.hint.datacall.chain_clear = chain_clear(chain): chain is the declared linked list; resets the list/free-node chain and writes its capacity to result.
logicsugar.datacall.chain_alloc = Allocate node
logicsugar.lst.datacall.chain_alloc = chain_alloc(chain): chain is the declared linked list; allocates a free node, sets its next to -1 and writes its index to result, or -1 when none is free.
logicsugar.hint.datacall.chain_alloc = chain_alloc(chain): chain is the declared linked list; allocates a free node, sets its next to -1 and writes its index to result, or -1 when none is free.
logicsugar.datacall.chain_free = Free node
logicsugar.lst.datacall.chain_free = chain_free(chain, index): chain is the declared linked list and index is the node index; releases the node and links it back to the free chain, writing 1 on success or -1 for an invalid index.
logicsugar.hint.datacall.chain_free = chain_free(chain, index): chain is the declared linked list and index is the node index; releases the node and links it back to the free chain, writing 1 on success or -1 for an invalid index.
logicsugar.datacall.chain_get = Get node value
logicsugar.lst.datacall.chain_get = chain_get(chain, index): chain is the declared linked list and index is the node index; writes that node's value to result, or NaN when out of range.
logicsugar.hint.datacall.chain_get = chain_get(chain, index): chain is the declared linked list and index is the node index; writes that node's value to result, or NaN when out of range.
logicsugar.datacall.chain_set = Set node value
logicsugar.lst.datacall.chain_set = chain_set(chain, index, value): chain is the declared linked list, index is the node index and value is stored in it; writes 1 on success, or -1 when out of range (nothing is written).
logicsugar.hint.datacall.chain_set = chain_set(chain, index, value): chain is the declared linked list, index is the node index and value is stored in it; writes 1 on success, or -1 when out of range (nothing is written).
logicsugar.datacall.chain_next = Next node
logicsugar.lst.datacall.chain_next = chain_next(chain, index): chain is the declared linked list and index is the node index; writes that node's next index to result, or -1 when out of range.
logicsugar.hint.datacall.chain_next = chain_next(chain, index): chain is the declared linked list and index is the node index; writes that node's next index to result, or -1 when out of range.
logicsugar.datacall.chain_link = Link nodes
logicsugar.lst.datacall.chain_link = chain_link(chain, index, next): chain is the declared linked list, index is the node whose next field changes and next is the target index (-1 means tail); writes 1 on success, or -1 when index is invalid.
logicsugar.hint.datacall.chain_link = chain_link(chain, index, next): chain is the declared linked list, index is the node whose next field changes and next is the target index (-1 means tail); writes 1 on success, or -1 when index is invalid.
logicsugar.datacall.chain_set_head = Set head
logicsugar.lst.datacall.chain_set_head = chain_set_head(chain, index): chain is the declared linked list and index is the new head value; assigns it without validation and writes 1 to result.
logicsugar.hint.datacall.chain_set_head = chain_set_head(chain, index): chain is the declared linked list and index is the new head value; assigns it without validation and writes 1 to result.
logicsugar.datacall.chain_head = Read head
logicsugar.lst.datacall.chain_head = chain_head(chain): chain is the declared linked list; writes its current head index to result.
logicsugar.hint.datacall.chain_head = chain_head(chain): chain is the declared linked list; writes its current head index to result.
logicsugar.datacall.chain_len = Length
logicsugar.lst.datacall.chain_len = chain_len(chain): chain is the declared linked list; traverses from its head and writes the reachable node count to result.
logicsugar.hint.datacall.chain_len = chain_len(chain): chain is the declared linked list; traverses from its head and writes the reachable node count to result.
