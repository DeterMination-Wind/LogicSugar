la.err.matrix_row_oob = Row {1} out of bounds for matrix '{0}' (rows {2})
la.err.matrix_col_oob = Column {1} out of bounds for matrix '{0}' (cols {2})
la.err.matrix_two_indices = Matrix '{0}' requires two indices (m[i][j])
la.err.len_arg_var = len() requires a declared array or structure name
la.err.len_matrix = len() is not supported for matrix '{0}'; use an array length or rows*cols
la.err.len_unknown = Unknown array or structure: {0}
la.err.intrinsic_array_arg = {0}() expects a declared array name
la.err.intrinsic_bitset_arg = {0}() expects a declared bitset name
la.err.intrinsic_bitset_unknown = {0}() references undeclared bitset '{1}'
la.err.intrinsic_chain_arg = {0}() expects a declared chain name
la.err.intrinsic_container_arg = {0}() expects a declared {1} name
la.err.intrinsic_container_kind = {0}() expects a {1} but ''{2}'' is a {3}
la.err.intrinsic_copy_size = copy() requires arrays of equal size ({0} vs {1})
la.err.intrinsic_listheap_arg = {0}() expects a declared {1} name
la.err.intrinsic_listheap_kind = {0}() expects a {1} but ''{2}'' is a {3}
la.err.intrinsic_map_arg = {0}() expects a declared map name
la.err.intrinsic_map_no_context = {0}() cannot resolve '{1}': no map declaration context
la.err.intrinsic_matrix_size = {0}(): matrix '{1}' is too large
la.err.intrinsic_no_context = {0}() cannot resolve '{1}': no declaration context
la.err.intrinsic_unknown_array = {0}() references undeclared array '{1}'
la.err.intrinsic_unknown_chain = {0}() references undeclared chain '{1}'
la.err.intrinsic_unknown_container = {0}() references undeclared container ''{1}''
la.err.intrinsic_unknown_listheap = {0}() references undeclared list or heap ''{1}''
la.err.intrinsic_unknown_map = {0}() references undeclared map '{1}'
la.err.intrinsic_uset_arg = {0}() expects a declared set name
la.err.intrinsic_uset_no_context = {0}() cannot resolve '{1}': no set declaration context
la.err.intrinsic_unknown_uset = {0}() references undeclared set '{1}'
la.err.record_field_conflict_array = field variable {0} of record {1} conflicts with an array or matrix of the same name
la.err.record_field_conflict_duplicate = field variable {0} is declared by both record {1} and record {2}
la.err.record_field_conflict_record = field variable {0} of record {1} conflicts with record {0}
la.err.record_field_duplicate = duplicate field {0} in record {1}
la.err.record_field_invalid = field name {0} of record {1} must match [A-Za-z_][A-Za-z0-9_]*
la.err.record_name_conflict_array = record name {0} conflicts with an array or matrix of the same name
la.err.record_name_conflict_field = record name {0} conflicts with field variable {0} of record {1}
la.err.record_name_conflict_function = record name {0} conflicts with a function of the same name
la.err.record_name_duplicate = duplicate record name {0}
la.err.record_name_empty = record name must not be empty
la.err.record_name_invalid = record name {0} must match [A-Za-z_][A-Za-z0-9_]*
la.err.record_name_reserved = record name {0} uses the reserved __ls_ prefix
la.err.record_no_fields = record {0} must declare at least one field
la.err.record_too_many_fields = record {0} declares {1} fields; at most 8 are supported
la.err.record_unknown_field = record {0} has no field {1}

