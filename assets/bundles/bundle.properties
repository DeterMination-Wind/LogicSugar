# ===== Data subsystem: card hints =====
logicsugar.hint.matrix.name = Matrix name used with two subscripts in expressions, e.g. m[i][j]. Address = base + i*cols + j; must be unique across the program.
logicsugar.hint.matrix.rows = Number of rows; an integer of at least 1. Literal row subscripts outside [0, rows) are compile errors.
logicsugar.hint.matrix.cols = Number of columns; an integer of at least 1. Literal column subscripts outside [0, cols) are compile errors.
logicsugar.hint.arrayinit.name = Array to initialize; it must be declared by an array card above. Slot 0..7 holds the value written to buf[0..7]; ~ skips that slot.
logicsugar.hint.stack.name = Stack name used by spush/spop/speek/ssize/sclear expressions. Must be unique across the program.
logicsugar.hint.stack.memory = Memory block variable holding the stack data, e.g. cell1. Declared ranges must not overlap other structures on the same block.
logicsugar.hint.stack.base = Starting physical address of the stack on the memory block; a non-negative integer literal.
logicsugar.hint.stack.size = Maximum number of elements; an integer of at least 1. Pushing to a full stack returns the current length and writes nothing.
logicsugar.hint.queue.name = Queue name used by qpush/qpop/qpeek/qsize/qclear expressions. Must be unique across the program.
logicsugar.hint.queue.memory = Memory block variable holding the queue data, e.g. cell1. Declared ranges must not overlap other structures on the same block.
logicsugar.hint.queue.base = Starting physical address of the ring buffer on the memory block; a non-negative integer literal.
logicsugar.hint.queue.size = Ring buffer capacity; an integer of at least 1. Pushing to a full queue returns the current length and writes nothing.
logicsugar.hint.deque.name = Deque name used by dpushf/dpushb/dpopf/dpopb/dpeekf/dpeekb/dsize/dclear. Must be unique across the program.
logicsugar.hint.deque.memory = Memory block variable holding the deque data, e.g. cell1. Declared ranges must not overlap other stack/queue/deque cards on the same block.
logicsugar.hint.deque.base = Starting physical address of the ring buffer on the memory block; a non-negative integer literal.
logicsugar.hint.deque.size = Ring buffer capacity; an integer of at least 1. Pushing onto a full deque returns the current length and writes nothing.
logicsugar.hint.bitset.name = Bitset name used by bset/bclr/btest/bcount expressions. Must be unique across the program.
logicsugar.hint.bitset.memory = Memory block variable holding the bit words, e.g. cell1. Declared ranges must not overlap other structures on the same block.
logicsugar.hint.bitset.base = Starting physical address of the first word on the memory block; a non-negative integer literal.
logicsugar.hint.bitset.words = Number of 64-bit words; an integer of at least 1. Bit index i lives in word i/64 at bit i%64.
logicsugar.hint.map.name = Map name used by mapset/mapget/maphas/mapdel/mapsize/mapclear expressions. Call mapclear(m) once before the first use to store NaN in every key slot; must be unique across the program.
logicsugar.hint.map.memory = Memory block variable holding keys and values, e.g. cell1. Keys occupy [base, base+capacity), values [base+capacity, base+2*capacity).
logicsugar.hint.map.base = Starting physical address of the key region; a non-negative integer literal.
logicsugar.hint.map.capacity = Number of key/value slots; an integer of at least 1. Needs 2*capacity memory cells; string keys are not supported.
logicsugar.hint.uset.name = Set name used by uadd/uhas/udel/usize/uclear. Call uclear(s) once before the first use to store NaN in every slot; must be unique across the program.
logicsugar.hint.uset.memory = Memory block variable holding the keys, e.g. cell1. Occupies [base, base+capacity).
logicsugar.hint.uset.base = Starting physical address of the key region; a non-negative integer literal.
logicsugar.hint.uset.capacity = Number of key slots; an integer of at least 1. Call uclear before the first use. String keys are not supported.
logicsugar.hint.list.name = List name used by lappend/lget/lset/linsert/lremove/lfind/lsize expressions. Must be unique across the program.
logicsugar.hint.list.memory = Memory block variable holding the list data, e.g. cell1. Declared ranges must not overlap other structures on the same block.
logicsugar.hint.list.base = Starting physical address of the list on the memory block; a non-negative integer literal.
logicsugar.hint.list.size = Maximum number of elements; an integer of at least 1. Appending to a full list returns the current length and writes nothing.
logicsugar.hint.heap.name = Min-heap name used by hpush/hpop/hsize expressions. Must be unique across the program.
logicsugar.hint.heap.memory = Memory block variable holding the heap data, e.g. cell1. Declared ranges must not overlap other structures on the same block.
logicsugar.hint.heap.base = Starting physical address of the heap on the memory block; a non-negative integer literal.
logicsugar.hint.heap.size = Maximum number of elements; an integer of at least 1. Pushing to a full heap returns the current length and writes nothing.
logicsugar.hint.chain.name = Chain name used by cinit/cclear/cnew/cfree/cget/cset/cnext/clink/cshead/chead/clen expressions. Must be unique across the program.
logicsugar.hint.chain.memory = Memory block variable holding the chain nodes, e.g. cell1. Node i uses base+2*i for its value and base+2*i+1 for its next; declared ranges must not overlap other structures on the same block.
logicsugar.hint.chain.base = Starting physical address of the first node's value slot; a non-negative integer literal.
logicsugar.hint.chain.size = Number of nodes; an integer of at least 1. Needs 2*size memory cells; cnew returns -1 when the free list is empty.

# ===== Data subsystem: palette descriptions =====
logicsugar.lst.matrix = Matrix: names a rows x cols region of a memory block so expressions can read and write m[i][j]; address = base + i*cols + j.
logicsugar.lst.arrayinit = Array Init: writes up to 8 literal values into consecutive array slots at this point in the program.
logicsugar.lst.record = Record: declares a fixed set of fields; p.field reads and p.field = value writes a plain variable per field.
logicsugar.lst.stack = Stack: names a LIFO region; spush/spop/speek/ssize/sclear expand to read/write plus a hidden top variable.
logicsugar.lst.queue = Queue: names a ring-buffer region; qpush/qpop/qpeek/qsize/qclear expand to read/write plus hidden head/tail/count variables.
logicsugar.lst.deque = Deque: names a double-ended ring buffer; dpushf/dpushb/dpopf/dpopb/dpeekf/dpeekb/dsize/dclear.
logicsugar.lst.bitset = Bitset: names 64-bit words in a memory block; bset/bclr/btest/bcount expand to and/or/shl/shr operations.
logicsugar.lst.map = Map: names an open-addressing hash table (keys then values); mapset/mapget/maphas/mapdel/mapsize/mapclear. Call mapclear before the first use.
logicsugar.lst.uset = Set: names an open-addressing key set; uadd/uhas/udel/usize/uclear. Call uclear before the first use.
logicsugar.lst.list = List: names an ordered region with a hidden count; lappend/lget/lset/linsert/lremove/lfind/lsize.
logicsugar.lst.heap = Heap: names a min-heap region with a hidden count; hpush/hpop/hsize.
logicsugar.lst.chain = Chain: names size nodes of two slots each (value then next); cinit/cclear/cnew/cfree/cget/cset/cnext/clink/cshead/chead/clen expand to read/write plus hidden head/free variables. Call cinit before the first use.

