setting.logicsugar.funcMode.name = Function Mode
setting.logicsugar.funcMode.description = How function calls are compiled: normal shares one subroutine per function (@counter); inline copies the body into every call site.
setting.logicsugar.assertEmit.name = Debug Assert Build
setting.logicsugar.assertEmit.description = Single-player/editor only: when enabled, assertion cards are saved into the processor as real instructions (breakpoint pauses the game; failures loop in place with an on-map message, or pause at the instruction with "Breakpoint on Failed Assertion"). Vanilla clients cannot parse these lines, and while connected to or hosting a multiplayer game the compiler always strips assertions. Debug builds made here must never be shared to vanilla clients — assertions always survive in the source carrier either way.
setting.logicsugar.disableBreakpoints.name = Disable Breakpoints
setting.logicsugar.disableBreakpoints.description = Disabled breakpoints do not stop execution: the program continues with the next instruction. Failed assertions routed to breakpoints are ignored while this is off.
setting.logicsugar.assertsAreBreakpoints.name = Breakpoint on Failed Assertion
setting.logicsugar.assertsAreBreakpoints.description = When enabled, a failed assertion pauses the game at the failing instruction instead of looping on it. If breakpoints are disabled, the assertion is ignored.
setting.logicsugar.detachCameraOnBreakpoint.name = Detach Camera on Breakpoint
setting.logicsugar.detachCameraOnBreakpoint.description = When a breakpoint hits, center the camera on the processor and temporarily detach it so the processor stays in view. The previous camera setting is restored when the game is unpaused.
setting.logicsugar.waitIndication.name = Show Waits Longer Than (s)
setting.logicsugar.waitIndication.description = Draw a progress arc on processors executing a wait instruction longer than this threshold. 0 hides wait indication completely.
setting.logicsugar.processorScan.name = Processor Scans Per Frame
setting.logicsugar.processorScan.description = How many processors are inspected per frame to detect stopped/waiting states. Lower this if very processor-heavy maps suffer from the overlay.
setting.logicsugar.warnEffect.name = Visual Warning
setting.logicsugar.warnEffect.description = Map effects drawing attention to stopped or failed processors: never, once when the failure appears, or periodically every n seconds.
setting.logicsugar.showUnitFlags.name = Show Unit Flags
setting.logicsugar.showUnitFlags.description = Draw each unit's logic flag in red above the unit. Units with the default flag 0 are left unmarked. Display only: saves, logic execution and multiplayer sync are unaffected.
