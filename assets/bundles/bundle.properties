# ===== Renamed data-structure operations (STL-named) =====
logicsugar.datacall.stack_push = Push
logicsugar.lst.datacall.stack_push = stack_push(s, value): s is the declared stack and value is pushed onto it; writes the new stack length to result, or -1 when the stack is full (nothing is pushed).
logicsugar.hint.datacall.stack_push = stack_push(s, value): s is the declared stack and value is pushed onto it; writes the new stack length to result, or -1 when the stack is full (nothing is pushed).
logicsugar.datacall.stack_pop = Pop
logicsugar.lst.datacall.stack_pop = stack_pop(s): s is the declared stack; removes and writes the top value to result (empty stack returns NaN).
logicsugar.hint.datacall.stack_pop = stack_pop(s): s is the declared stack; removes and writes the top value to result (empty stack returns NaN).
logicsugar.datacall.stack_top = Peek
logicsugar.lst.datacall.stack_top = stack_top(s): s is the declared stack; reads the top value without removing it and writes it to result (empty returns NaN).
logicsugar.hint.datacall.stack_top = stack_top(s): s is the declared stack; reads the top value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.stack_size = Size
logicsugar.lst.datacall.stack_size = stack_size(s): s is the declared stack; writes its current element count to result.
logicsugar.hint.datacall.stack_size = stack_size(s): s is the declared stack; writes its current element count to result.
logicsugar.datacall.stack_clear = Clear
logicsugar.lst.datacall.stack_clear = stack_clear(s): s is the declared stack; clears its contents and hidden top counter. This card has no result value.
logicsugar.hint.datacall.stack_clear = stack_clear(s): s is the declared stack; clears its contents and hidden top counter. This card has no result value.
logicsugar.datacall.queue_push = Push
logicsugar.lst.datacall.queue_push = queue_push(q, value): q is the declared queue and value is appended; writes the new queue length to result, or -1 when the queue is full (nothing is appended).
logicsugar.hint.datacall.queue_push = queue_push(q, value): q is the declared queue and value is appended; writes the new queue length to result, or -1 when the queue is full (nothing is appended).
logicsugar.datacall.queue_pop = Pop
logicsugar.lst.datacall.queue_pop = queue_pop(q): q is the declared queue; removes the front value and writes it to result (empty returns NaN).
logicsugar.hint.datacall.queue_pop = queue_pop(q): q is the declared queue; removes the front value and writes it to result (empty returns NaN).
logicsugar.datacall.queue_front = Peek
logicsugar.lst.datacall.queue_front = queue_front(q): q is the declared queue; reads the front value without removing it and writes it to result (empty returns NaN).
logicsugar.hint.datacall.queue_front = queue_front(q): q is the declared queue; reads the front value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.queue_size = Size
logicsugar.lst.datacall.queue_size = queue_size(q): q is the declared queue; writes its current element count to result.
logicsugar.hint.datacall.queue_size = queue_size(q): q is the declared queue; writes its current element count to result.
logicsugar.datacall.queue_clear = Clear
logicsugar.lst.datacall.queue_clear = queue_clear(q): q is the declared queue; clears its contents and head/tail/count state. This card has no result value.
logicsugar.hint.datacall.queue_clear = queue_clear(q): q is the declared queue; clears its contents and head/tail/count state. This card has no result value.
logicsugar.datacall.deque_push_front = Push front
logicsugar.lst.datacall.deque_push_front = deque_push_front(d, value): d is the declared deque and value is inserted at the front; writes the new deque length to result, or -1 when the deque is full (nothing is inserted).
logicsugar.hint.datacall.deque_push_front = deque_push_front(d, value): d is the declared deque and value is inserted at the front; writes the new deque length to result, or -1 when the deque is full (nothing is inserted).
