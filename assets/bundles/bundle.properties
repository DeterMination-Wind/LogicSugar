logicsugar.datacall.speek = Peek
logicsugar.lst.datacall.speek = speek(s): s is the declared stack; reads the top value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.ssize = Size
logicsugar.lst.datacall.ssize = ssize(s): s is the declared stack; writes its current element count to result.
logicsugar.datacall.sclear = Clear
logicsugar.lst.datacall.sclear = sclear(s): s is the declared stack; clears its contents and hidden top counter. This card has no result value.
logicsugar.datacall.qpush = Push
