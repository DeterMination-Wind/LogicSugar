# ===== Persistent data intrinsic cards =====
logicsugar.datacall.operation = operation
logicsugar.datacall.arguments = comma-separated arguments
logicsugar.hint.datacall.operation = Fixed data-structure operation; add another block from its category to change operations.
logicsugar.hint.datacall.arguments = Enter arguments in function order, separated by commas.
logicsugar.lst.datacall = Persistent data-structure operation; it lowers through the matching intrinsic.
logicsugar.datacall.sum = Sum
logicsugar.lst.datacall.sum = sum(buf): buf is the declared array or matrix; writes the element total to the card's result variable (default result).
logicsugar.datacall.avg = Average
logicsugar.lst.datacall.avg = avg(buf): buf is the declared array or matrix; writes the arithmetic mean to the result variable (default result).
logicsugar.datacall.min = Minimum
