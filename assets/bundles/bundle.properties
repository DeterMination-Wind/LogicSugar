logicsugar.datacall.dpopb = Pop back
logicsugar.lst.datacall.dpopb = dpopb(d): d is the declared deque; removes the back value and writes it to result (empty returns NaN).
logicsugar.datacall.dpeekf = Peek front
logicsugar.lst.datacall.dpeekf = dpeekf(d): d is the declared deque; reads the front value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.dpeekb = Peek back
logicsugar.lst.datacall.dpeekb = dpeekb(d): d is the declared deque; reads the back value without removing it and writes it to result (empty returns NaN).
logicsugar.datacall.dsize = Size
