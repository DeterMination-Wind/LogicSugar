lcategory.asserts.description = Runtime checks and debugging: assertions, errors, logs and breakpoints.
lcategory.advcontrol = Advanced Flow Control
lcategory.advcontrol.description = Structured for / while / switch / if and function cards. Vanilla jump and end stay in Flow Control.
lcategory.datastruct = Data Structures
lcategory.datastruct.description = Declaration cards for stacks, queues, deques, maps, sets, lists, heaps, bitsets, chains and records.
lcategory.arrayalgo = Array Algorithms
lcategory.arrayalgo.description = Array, matrix and array-init cards. Bulk operations such as sum, reverse and bsearch are used in expressions.
logicsugar.undo = Undo
logicsugar.redo = Redo
setting.logicsugar.hideVars.name = Hide Internal Variables in Browser
setting.logicsugar.hideVars.description = Hide Logic Sugar's compiler-generated variables (__ls_ function/carrier vars, _0/_1 expression temporaries) in MindustryX's logic support panel. Purely cosmetic; logic execution, saves and network sync are unaffected.
setting.logicsugar.ctrlClickCopy.name = Ctrl+Click = Copy Statement
setting.logicsugar.ctrlClickCopy.description = With Ctrl held, clicking a statement selects it and immediately starts a copy-drag. Turn off to make Ctrl+click behave like a normal click (move drag).
setting.logicsugar.ctrlDragCopy.name = Ctrl+Drag = Copy Statements
setting.logicsugar.ctrlDragCopy.description = Holding Ctrl while dragging statements copies them instead of moving. Turn off to make Ctrl+drag behave like a normal move drag. Middle-click copying is not affected.
setting.logicsugar.dragExpandSpacing.name = Expand Spacing While Dragging
setting.logicsugar.dragExpandSpacing.description = While dragging, temporarily widen the gap between cards to 10 units for easier reading and selection. Turn off to keep spacing constant during drag — this fully eliminates viewport/live-preview offset issues (and statements are also blocked from being dragged inside collapsed blocks).
setting.logicsugar.compactCards.name = Compact Card Layout
setting.logicsugar.compactCards.description = Remove the gap between statement cards so more statements fit on screen. Turn off to restore the vanilla spacing between cards.
setting.logicsugar.localizeCards.name = Localize Statement Cards
setting.logicsugar.localizeCards.description = Show Logic Sugar card titles (For Begin, If Begin, assertions, ...) in the current game language. Turn off to keep the original English card titles. Takes effect the next time the logic editor is opened.
