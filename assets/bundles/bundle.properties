logicsugar.hint.if.condition = Condition of the if block; its body runs when this is true.
logicsugar.hint.elif = Alternative condition checked when the previous if/elif was false.
logicsugar.hint.switch.value = Value compared against each case below; the first match runs its body.
logicsugar.hint.case = A value compared against the switch expression; the first match runs its body.
logicsugar.hint.func.def = Defines a function; its body is shared by every call site.
logicsugar.hint.func.call = Calls a function; its body runs as if pasted here.
logicsugar.hint.func.return = Ends the current function call; may hand a value back to the caller.
logicsugar.hint.while.condition = Loop condition; the body repeats while this is true.
logicsugar.hint.for.variable = Loop variable, counting from the initial value by the step.
logicsugar.hint.for.initial = Starting value of the loop variable.
logicsugar.hint.for.step = Value added to the loop variable every iteration.
logicsugar.hint.for.condition = Condition on the loop variable; the loop keeps running while it holds.
logicsugar.hint.array.name = Array name used with subscripts in expressions, e.g. buf[i]. Must be a valid identifier and unique across the program.
logicsugar.hint.array.memory = Memory block variable holding the data, e.g. cell1. Arrays declared on the same block must not overlap.
logicsugar.hint.array.base = Starting physical address of the array on the memory block; a non-negative integer literal.
logicsugar.hint.array.size = Number of elements; an integer of at least 1. Out-of-range subscripts keep vanilla memory semantics.
logicsugar.lst.forbegin = For loop: counts a variable from an initial value by a step while a condition holds.
logicsugar.lst.whilebegin = While loop: repeats its body while the condition is true.
logicsugar.lst.switchbegin = Switch: compares a value against the case labels below and runs the first match.
logicsugar.lst.case = Case label: a value to match against the switch expression.
logicsugar.lst.ifbegin = If: runs its body when the condition is true.
logicsugar.lst.elseif = Else if: an alternative condition checked when the previous if/else if was false.
logicsugar.lst.else = Else: runs when none of the previous if/else if conditions held.
logicsugar.lst.funcdef = Function definition: declares a callable function with parameters.
logicsugar.lst.funccall = Function call: runs a function's body at this point, optionally storing its result.
logicsugar.lst.return = Return: ends the current function call, optionally handing a value back.
logicsugar.lst.break = Break: exits the innermost loop or switch.
logicsugar.lst.continue = Continue: skips to the next iteration of the innermost loop.
logicsugar.lst.blockend = End: closes the nearest open block.
logicsugar.lst.array = Array: names a range of a memory block so expressions can read and write buf[i] subscripts.
logicsugar.lst.assertbounds = Halt execution of this processor when a complex assertion is not met.
logicsugar.lst.assertequals = Halt execution of this processor when a variable doesn't match the expected value.
logicsugar.lst.assertflush = Prepare this processor for executing the assertprints instruction.
logicsugar.lst.assertprints = Halt execution of this processor when the text buffer content doesn't match the expected value.
logicsugar.lst.asserttype = Halt execution of this processor when a variable isn't of the expected type.
logicsugar.lst.error = Display the error message and halt execution of this processor.
logicsugar.lst.log = Write a message into the game's log file with the specified level.
logicsugar.lst.breakpoint = Pause the execution of this processor and the game when a condition is met.
