setting.logicsugar.switchStrategy.name = Switch Strategy
setting.logicsugar.switchStrategy.description = How switch dispatch is lowered: auto picks per switch between the comparison chain and an @counter jump table by instruction cost (switches with many repeated case values compile to tables); chainOnly always keeps the comparison chain, matching older output byte-for-byte. Jump tables assume integer case values; anything else falls back to the chain automatically.
logicsugar.settings.switchstrategy.auto = auto (table when cheaper)
logicsugar.settings.switchstrategy.chainOnly = chainOnly
