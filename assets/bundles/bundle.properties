logicsugar.datacall.qpop = Pop
logicsugar.lst.datacall.qpop = qpop(q): q is the declared queue; removes the front value and writes it to result (empty returns NaN).
logicsugar.datacall.qpeek = Peek
logicsugar.lst.datacall.qpeek = qpeek(q): q is the declared queue; reads the front value without removing it and writes it to result (empty returns NaN).
