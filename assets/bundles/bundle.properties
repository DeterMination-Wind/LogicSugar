logicsugar.datacall.max = Maximum
logicsugar.lst.datacall.max = max(buf): buf is the declared array or matrix; writes its largest element to the result variable (default result).
logicsugar.datacall.count = Count matches
logicsugar.lst.datacall.count = count(buf, value): buf is the declared array or matrix and value is the value to compare; writes the number of matches to the result variable (default result).
logicsugar.datacall.indexof = Find index
logicsugar.lst.datacall.indexof = indexof(buf, value): buf is the declared array or matrix and value is the target; writes the first matching index, or -1 when absent, to result.
logicsugar.datacall.fill = Fill
logicsugar.lst.datacall.fill = fill(buf, value): buf is the declared array or matrix and value is written to every element. This card has no result value.
logicsugar.datacall.copy = Copy
