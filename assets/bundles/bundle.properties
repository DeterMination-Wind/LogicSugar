logicsugar.datacall.bclr = Clear
logicsugar.lst.datacall.bclr = bclr(bits, index): bits is the declared bitset and index is the bit number; clears that bit and writes 1 to result (out of range is a no-op but still returns 1).
logicsugar.datacall.btest = Test
