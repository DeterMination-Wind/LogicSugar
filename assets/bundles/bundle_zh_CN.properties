logicsugar.hint.datacall.lset = lset(list, index, value)：list 是已声明的列表，index 是元素下标，value 是要写入的值；成功向 result 写入 1，越界写入 0。
logicsugar.hint.datacall.linsert = linsert(list, index, value)：list 是已声明的列表，index 是插入位置，value 插入该位置；成功向 result 写入 1，无效或已满写入 0。
