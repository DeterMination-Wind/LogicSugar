instruction.dequedecl = 双端队列
instruction.stack = 栈
instruction.queue = 队列
instruction.deque = 双端队列
instruction.bitset = 位集
instruction.map = 哈希表
instruction.uset = 集合
instruction.listdecl = 列表
instruction.heapdecl = 堆
instruction.chaindecl = 链表
instruction.list = 列表
instruction.heap = 堆
instruction.chain = 链表

