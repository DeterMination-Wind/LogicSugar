logicsugar.hint.datacall.udel = udel(set, key)：set 是已声明的集合，key 是数字成员；删除成员，并把是否删除成功（1/0）写入 result。
logicsugar.hint.datacall.usize = usize(set)：set 是已声明的集合；把当前成员数量写入 result。
