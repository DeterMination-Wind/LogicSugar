logicsugar.hint.datacall.lfind = lfind(list, value)：list 是已声明的列表，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.lsize = lsize(list)：list 是已声明的列表；把当前元素数量写入 result。
