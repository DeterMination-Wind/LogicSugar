la.err.intrinsic_listheap_arg = {0}() 需要一个已声明的 {1} 名
la.err.intrinsic_listheap_kind = {0}() 需要 {1}，但 ''{2}'' 是 {3}
la.err.intrinsic_map_arg = {0}() 需要一个已声明的哈希表名
la.err.intrinsic_map_no_context = {0}() 无法解析 '{1}'：缺少哈希表声明上下文
la.err.intrinsic_matrix_size = {0}()：矩阵 '{1}' 过大
