setting.logicsugar.assertEmit.name = 调试断言构建
setting.logicsugar.assertEmit.description = 仅限单机/地图编辑器：开启后，断言卡片会作为真实指令保存进处理器（breakpoint 暂停游戏，断言失败在原地自旋并显示消息；开启「断言失败即断点」时改为在失败指令处暂停）。原版客户端无法解析这些行，联机（加入或自建）时编译器一律强制剥离断言；单机创建的调试构建同样切勿分享给原版客户端——无论开关与否，断言都随源码载体一同保存。
setting.logicsugar.disableBreakpoints.name = 禁用断点
setting.logicsugar.disableBreakpoints.description = 断点不再中断执行，程序直接继续下一条指令。开启「断言失败即断点」时，失败的断言也会被忽略。
setting.logicsugar.assertsAreBreakpoints.name = 断言失败即断点
setting.logicsugar.assertsAreBreakpoints.description = 开启后，断言失败会在失败指令处暂停游戏（而不是在原地自旋）。若断点已被禁用，断言将被完全忽略。
setting.logicsugar.detachCameraOnBreakpoint.name = 断点分离视角
setting.logicsugar.detachCameraOnBreakpoint.description = 命中断点时把视角居中到处理器并临时分离视角，避免取消暂停后视角立刻跳走。取消暂停时恢复原来的视角设置。
setting.logicsugar.waitIndication.name = 显示等待超过（秒）
setting.logicsugar.waitIndication.description = 处理器执行超过该阈值的 wait 指令时，在其上绘制进度圆环。设为 0 完全关闭等待指示。
setting.logicsugar.processorScan.name = 每帧扫描处理器数
setting.logicsugar.processorScan.description = 每帧检查多少个处理器来发现停止/等待状态。处理器极多的地图若因此卡顿可以调低。
setting.logicsugar.warnEffect.name = 视觉警告
setting.logicsugar.warnEffect.description = 用地图特效提醒停止或运行失败的处理器：从不、出现失败时一次，或每 n 秒循环一次。
setting.logicsugar.showUnitFlags.name = 显示单位 flag
setting.logicsugar.showUnitFlags.description = 在每个单位正上方用红色显示其逻辑 flag。flag 为默认值 0 的单位不显示。纯展示：不影响逻辑运行、存档与联机同步。
setting.logicsugar.colorizeUnitFlags.name = 为单位 flag 着色
setting.logicsugar.colorizeUnitFlags.description = 为每个不同的单位 flag 使用不同的鲜明颜色。前 10 个 flag 优先使用内置高对比度配色，更多 flag 随机分配鲜明颜色。纯展示：不影响逻辑运行、存档与联机同步。
