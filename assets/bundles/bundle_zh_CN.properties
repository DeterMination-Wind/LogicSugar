logicsugar.hint.matrix.name = 表达式中用双下标访问的矩阵名，如 m[i][j]。地址 = 基址 + i*列数 + j；必须全程序唯一。
logicsugar.hint.matrix.rows = 行数；至少为 1 的整数。字面量行下标超出 [0, 行数) 时编译期报错。
logicsugar.hint.matrix.cols = 列数；至少为 1 的整数。字面量列下标超出 [0, 列数) 时编译期报错。
logicsugar.hint.arrayinit.name = 要初始化的数组名，必须已由上方的 array 卡声明。槽 0..7 对应写入 buf[0..7] 的值；~ 表示跳过该槽。
logicsugar.hint.stack.name = 表达式中 spush/spop/speek/ssize/sclear 使用的栈名。必须全程序唯一。
logicsugar.hint.stack.memory = 承载栈数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.stack.base = 栈在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.stack.size = 最大元素个数；至少为 1 的整数。向满栈压入时返回当前长度且不写入。
logicsugar.hint.queue.name = 表达式中 qpush/qpop/qpeek/qsize/qclear 使用的队列名。必须全程序唯一。
logicsugar.hint.queue.memory = 承载队列数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.queue.base = 环形缓冲区在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.queue.size = 环形缓冲区容量；至少为 1 的整数。向满队列压入时返回当前长度且不写入。
logicsugar.hint.deque.name = 表达式中 dpushf/dpushb/dpopf/dpopb/dpeekf/dpeekb/dsize/dclear 使用的双端队列名。必须全程序唯一。
logicsugar.hint.deque.memory = 存放双端队列数据的内存块变量，如 cell1。同一内存块上与其它栈/队列/双端队列声明的区间不得重叠。
logicsugar.hint.deque.base = 环形缓冲区在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.deque.size = 环形缓冲区容量；至少为 1 的整数。向满的双端队列压入时返回当前长度且不写入。
logicsugar.hint.bitset.name = 表达式中 bset/bclr/btest/bcount 使用的位集名。必须全程序唯一。
logicsugar.hint.bitset.memory = 承载位字的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.bitset.base = 第一个字在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.bitset.words = 64 位字的个数；至少为 1 的整数。位下标 i 位于第 i/64 个字的第 i%64 位。
logicsugar.hint.map.name = 表达式中 mapset/mapget/maphas/mapdel/mapsize/mapclear 使用的哈希表名。首次使用前先调用一次 mapclear(m)，把所有 key 槽写为 NaN；必须全程序唯一。
logicsugar.hint.map.memory = 承载键与值的内存块变量，如 cell1。键占用 [基址, 基址+容量)，值占用 [基址+容量, 基址+2*容量)。
logicsugar.hint.map.base = 键区起始物理地址；非负整数字面量。
logicsugar.hint.map.capacity = 键/值槽位数；至少为 1 的整数。需要 2*容量 个内存单元；不支持字符串键。
logicsugar.hint.uset.name = 表达式中 uadd/uhas/udel/usize/uclear 使用的集合名。首次使用前先调用一次 uclear(s)，把所有槽写为 NaN；必须全程序唯一。
logicsugar.hint.uset.memory = 存放键的内存块变量，如 cell1。占用 [base, base+capacity)。
logicsugar.hint.uset.base = 键区起始物理地址；非负整数字面量。
logicsugar.hint.uset.capacity = 键槽位数；至少为 1 的整数。首次使用前先调用 uclear。不支持字符串键。
logicsugar.hint.list.name = 表达式中 lappend/lget/lset/linsert/lremove/lfind/lsize 使用的列表名。必须全程序唯一。
logicsugar.hint.list.memory = 承载列表数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.list.base = 列表在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.list.size = 最大元素个数；至少为 1 的整数。向满列表追加时返回当前长度且不写入。
logicsugar.hint.heap.name = 表达式中 hpush/hpop/hsize 使用的小顶堆名。必须全程序唯一。
logicsugar.hint.heap.memory = 承载堆数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.heap.base = 堆在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.heap.size = 最大元素个数；至少为 1 的整数。向满堆压入时返回当前长度且不写入。
logicsugar.hint.chain.name = 表达式中 cinit/cclear/cnew/cfree/cget/cset/cnext/clink/cshead/chead/clen 使用的链表名。必须全程序唯一。
logicsugar.hint.chain.memory = 承载链表节点的内存块变量，如 cell1。节点 i 的值槽在 基址+2*i、next 槽在 基址+2*i+1；声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.chain.base = 第一个节点值槽的起始物理地址；非负整数字面量。
logicsugar.hint.chain.size = 节点个数；至少为 1 的整数。需要 2*size 个内存单元；空闲链为空时 cnew 返回 -1。

# ===== 数据子系统：调色板说明 =====
logicsugar.lst.matrix = 矩阵：把内存块的一段 行数×列数 区间登记为命名矩阵，让表达式能用 m[i][j] 读写；地址 = 基址 + i*列数 + j。
logicsugar.lst.arrayinit = 数组初始化：在此处把最多 8 个字面量写入数组的连续槽位。
logicsugar.lst.record = 记录：声明一组固定字段；p.字段 读取、p.字段 = 值 写入，每个字段降级为一个普通变量。
logicsugar.lst.stack = 栈：把一段区间登记为后进先出栈；spush/spop/speek/ssize/sclear 展开为 read/write 加隐藏的栈顶变量。
logicsugar.lst.queue = 队列：把一段区间登记为环形缓冲区；qpush/qpop/qpeek/qsize/qclear 展开为 read/write 加隐藏的 head/tail/count 变量。
logicsugar.lst.deque = 双端队列：把一段区间登记为双端环形缓冲区；dpushf/dpushb/dpopf/dpopb/dpeekf/dpeekb/dsize/dclear。
logicsugar.lst.bitset = 位集：把内存块中的 64 位字登记为位集；bset/bclr/btest/bcount 展开为 and/or/shl/shr 运算。
logicsugar.lst.map = 哈希表：把一段区间登记为开放寻址哈希表（先键区后值区）；mapset/mapget/maphas/mapdel/mapsize/mapclear。首次使用前先调用 mapclear。
logicsugar.lst.uset = 集合：把一段区间登记为开放寻址键集合；uadd/uhas/udel/usize/uclear。首次使用前先调用 uclear。
logicsugar.lst.list = 列表：把一段区间登记为带隐藏计数的有序列表；lappend/lget/lset/linsert/lremove/lfind/lsize。
logicsugar.lst.heap = 堆：把一段区间登记为带隐藏计数的小顶堆；hpush/hpop/hsize。
logicsugar.lst.chain = 链表：把一段区间登记为单链表节点（每节点两槽：值、next）；cinit/cclear/cnew/cfree/cget/cset/cnext/clink/cshead/chead/clen 展开为 read/write 加隐藏的 head/free 变量。首次使用前先调用 cinit。

