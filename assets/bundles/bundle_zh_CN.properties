la.err.intrinsic_unknown_uset = {0}() 引用了未声明的集合 '{1}'
la.err.record_field_conflict_array = 记录 {1} 的字段变量 {0} 与同名的数组或矩阵冲突
la.err.record_field_conflict_duplicate = 字段变量 {0} 同时被记录 {1} 与记录 {2} 声明
la.err.record_field_conflict_record = 记录 {1} 的字段变量 {0} 与记录 {0} 冲突
